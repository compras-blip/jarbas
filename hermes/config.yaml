# Configuração do Hermes para o Atlas (fase 0).
# Este arquivo é a fonte da verdade: o scripts/deploy.sh copia ele para
# runtime/hermes/config.yaml, que o contêiner lê em /opt/data/config.yaml.
# Segredos NÃO entram aqui: ficam em .env.hermes.

# Modelo principal: ChatGPT pela Nous Portal (plano do ChatGPT conectado na Nous).
# Login no servidor: `hermes auth add nous` (código de dispositivo).
model:
  provider: nous
  default: openai/gpt-5.5   # cobrado no plano do ChatGPT (billing_mode subscription); trocar com /model se precisar

# Reserva automática: entra quando o principal falha (login/cobrança, limite, queda,
# resposta vazia) e o Hermes volta a tentar o principal na mensagem seguinte.
# Nunca modelo da OpenAI aqui: cairia junto com o plano do ChatGPT.
fallback_model:
  provider: nous
  model: google/gemini-3.8-flash

# Busca na web pela Nous (Tool Gateway): busca e leitura de página sem chave extra,
# cobrada por uso nos créditos da Nous. Ligada em 10/10/2026 após os testes 1, 5 e 9.
# Alternativa sem custo: brave-free (2.000 buscas/mês, só busca, precisa de chave do Brave).
web:
  backend: nous

# A política do Atlas: ligar só o necessário.
# Ficam ligados: web, memory, session_search, cronjob, todo, clarify, skills,
# vision, tts, file e terminal.
agent:
  disabled_toolsets:
    - browser          # entra na fase 4, com o cofre do 1Password
    - computer_use
    - desktop_ui
    - project
    - start_chat
    - setup
    - image_gen
    - video_gen
    - video
    - kanban
    - delegation       # sem subagentes por enquanto
    - code_execution   # o terminal já cobre; uma forma a menos de rodar código
    - x_search
    - spotify
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - yuanbao

# O Hermes já roda dentro de um contêiner Docker isolado do VPS,
# então o terminal roda "local" dentro desse contêiner.
terminal:
  backend: local
  timeout: 180

# Lembretes do agendador chegam limpos: sem cabeçalho "Cronjob Response (job_id)"
# nem rodapé "To stop or manage this job..." em inglês (teste 6, 10/10/2026).
cron:
  wrap_response: false

# Compactação de contexto: compacta quando a conversa passa de 150 mil tokens. A janela do
# gpt-5.5 pela Nous é de 1 milhão (medido 642 mil OK em 10/10/2026); sem este teto o Hermes
# só compactaria perto de 525 mil. Mantém as 20 últimas mensagens, o último pedido pendente e
# as mensagens do Bruno palavra por palavra. Evidências: atlas-compactacao-evidencias.md (10/10).
compression:
  threshold_tokens: 150000

# Quem resume é o modelo principal ("auto"); raciocínio baixo evita resumo cortado (issue #135602).
auxiliary:
  compression:
    reasoning_effort: low

# Comandos perigosos sempre pedem aprovação.
approvals:
  mode: manual

# Memória embutida (perfil curto, sempre no prompt) + Hindsight (memória longa).
memory:
  provider: hindsight
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false

# Toda skill que o Atlas criar ou alterar sozinho espera revisão humana.
skills:
  write_approval: true
